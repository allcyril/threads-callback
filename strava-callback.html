<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Strava 授權</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5f2;color:#181818}main{width:min(38rem,calc(100% - 2rem));box-sizing:border-box;padding:2rem;border:1px solid #ddd;border-radius:20px;background:#fff}code{display:block;overflow-wrap:anywhere;padding:1rem;border-radius:12px;background:#eee}button{margin-top:1rem;padding:.7rem 1rem;border:0;border-radius:999px;background:#fc4c02;color:#fff}.muted{color:#666;font-size:.9rem}</style></head><body><main><h1 id="title">正在讀取 Strava 授權結果…</h1><p id="message"></p><code id="result" hidden></code><button id="copy" hidden>複製授權碼</button><p class="muted">資料只在你的瀏覽器中顯示，不會由此頁上傳或保存。</p></main><script>const p=new URLSearchParams(location.search),c=p.get("code"),e=p.get("error"),s=p.get("scope"),t=document.querySelector("#title"),m=document.querySelector("#message"),r=document.querySelector("#result"),b=document.querySelector("#copy");if(c){t.textContent="Strava 授權成功";m.textContent="已授權範圍："+(s||"未回報");r.textContent=c;r.hidden=false;b.hidden=false;b.onclick=async()=>{await navigator.clipboard.writeText(c);b.textContent="已複製"}}else if(e){t.textContent="Strava 授權未完成";m.textContent=e}else{t.textContent="Strava OAuth Callback";m.textContent="頁面已就緒，等待 Strava OAuth 回傳。"}</script></body></html>
